name: ExpenseTracker CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Check Java files
        run: |
          echo "Checking ExpenseTracker Java project..."
          find . -name "*.java" -print
          test -f SimpleServer.java

      - name: Compile SimpleServer
        run: |
          mkdir -p build
          javac -d build SimpleServer.java

      - name: Build completed
        run: echo "ExpenseTracker CI build completed successfully!"
