name: ExpenseTracker CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Verify ExpenseTracker project
        run: |
          echo "ExpenseTracker project checked successfully."
          echo "Java source files:"
          find . -name "*.java" -print

      - name: CI Build Check
        run: |
          echo "Build and CI checks completed successfully!"
